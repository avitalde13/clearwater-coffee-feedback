<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nook Café – QR code</title>
  <style>
    @page { size: A4; margin: 0; }
    * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    html, body { margin: 0; background: #ffffff; color: #2e211a; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .nook { display: inline-flex; align-items: flex-end; line-height: 1; }
    .nook .o { position: relative; display: inline-block; width: 0.72em; height: 0.62em; margin: 0 0.16em 0.04em 0.02em;
      border: 0.13em solid currentColor; border-top-width: 0.1em; border-radius: 0.06em 0.06em 0.36em 0.36em; }
    .nook .o::after { content: ""; position: absolute; right: -0.34em; top: 0.06em; width: 0.22em; height: 0.26em;
      border: 0.1em solid currentColor; border-left: 0; border-radius: 0 0.18em 0.18em 0; }
    body { width: 210mm; height: 297mm; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .wordmark { color: #4a3426; text-align: center; margin-bottom: 10mm; }
    .wordmark .nook { font-size: 40pt; font-weight: 800; }
    .wordmark small { display: block; font-size: 11pt; letter-spacing: 7pt; color: #a8643b; font-weight: 700; margin-top: 3mm; text-transform: uppercase; }
    .qr { width: 130mm; height: 130mm; }
    p { margin: 8mm 0 0; font-size: 12pt; color: #7a6656; }
  </style>
</head>
<body>
  <div class="wordmark"><span class="nook">N<i class="o"></i><i class="o"></i>K</span><small>café</small></div>
  <img class="qr" src="qr-feedback.svg" alt="QR code to the feedback page">
  <p>nook-cafe.up.railway.app/feedback</p>
</body>
</html>
